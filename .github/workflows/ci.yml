name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:

  # Job 1: Build, test and package
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - uses: actions/checkout@v4

      # Install Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Build project and run tests
      - name: Build and test
        run: mvn -B clean verify

      # Upload generated JAR
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar


  # Job 2: Run the application (smoke test)
  run-app:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # Download JAR from previous job
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar

      # Show downloaded files
      - name: List files
        run: ls

      # Run the application
      - name: Run application
        run: java -jar *.jar

     # Job 3: Build Docker image
  docker:
     needs: build
     runs-on: ubuntu-latest

     steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
           name: app-jar
           path: target
        # Setup Docker Buildx (Essential for Caching)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

        # Build the image with Cache support
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # Load it into local docker images so Trivy can scan it
          tags: ${{ secrets.DOCKER_USERNAME }}/java-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      # --- TRIVY SCAN STEP ---
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
           image-ref: '${{ secrets.DOCKER_USERNAME }}/java-demo:${{ github.sha }}'
           format: 'table'
           exit-code: '1' # This stops the pipeline if CRITICAL issues are found
           ignore-unfixed: true
           #vuln-type: 'os,library'
           severity: 'CRITICAL,HIGH'

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/java-demo:${{ github.sha }}
