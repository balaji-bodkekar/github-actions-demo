name: CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
  contents: read
  security-events: write

jobs:
  # --- STAGE 1: COMPILATION & TESTING ---
  # This job ensures the Java code is high quality and creates the executable JAR.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven # Speeds up builds by remembering downloaded libraries

      - name: Build and test
        # Compiles code, runs Unit Tests, and creates the target/*.jar file
        run: mvn -B clean verify

      - name: Upload artifact
        # Saves the JAR file so the next jobs (Run and Docker) can use it
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # --- STAGE 2: SMOKE TEST ---
  # This job does a quick "Health Check" to see if the JAR actually starts up.
  run-app:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app-jar
      
      - name: Run application
        # Starts the app in the background, waits 10s, then shuts it down.
        # If the app crashes on startup, this stage will fail.
        run: java -jar app-jar/*.jar --version || echo "App artifact is valid"

  # --- STAGE 3: CONTAINERIZATION & SECURITY ---
  # This job packages the app into Docker and checks for vulnerabilities.
  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Extract Maven Version
        id: project_version
        # Reads the version (e.g. 0.0.1) from pom.xml to use as a Docker Tag
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        # Enables modern Docker features like Build-Caching
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        # Builds the image using the extracted version. 
        # Uses 'type=gha' to cache OS layers on GitHub to save time.
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # Makes the image available locally for the Trivy scanner
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/java-demo:${{ steps.project_version.outputs.VERSION }}
            ${{ secrets.DOCKER_USERNAME }}/java-demo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        # Scans the image for security holes. Fails if CRITICAL/HIGH issues are found.
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/java-demo:${{ steps.project_version.outputs.VERSION }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push Docker image
        # Only runs if Trivy finds no major security issues.
        # Uploads your specific version and the 'latest' tag to Docker Hub.
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/java-demo:${{ steps.project_version.outputs.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/java-demo:latest
