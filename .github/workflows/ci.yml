name: CI

on:
  workflow_dispatch:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.x'

      - name: Run Pre-Commit Hooks
        uses: pre-commit/action@v3.0.1
        
  # --- STAGE 1: COMPILATION & TESTING ---
  # This job ensures the Java code is high quality and creates the executable JAR.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven # Speeds up builds by remembering downloaded libraries

      - name: Build and test
        # Compiles code, runs Unit Tests, and creates the target/*.jar file
        run: mvn -B clean verify

      - name: Upload artifact
        # Saves the JAR file so the next jobs (Run and Docker) can use it
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # --- STAGE 2: SMOKE TEST ---
  # This job does a quick "Health Check" to see if the JAR actually starts up.
  run-app:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: app-jar
      
      - name: Run application
        # Starts the app in the background, waits 10s, then shuts it down.
        # If the app crashes on startup, this stage will fail.
        run: java -jar app-jar/*.jar --version || echo "App artifact is valid"

  # --- STAGE 3: CONTAINERIZATION & SECURITY ---
  # This job packages the app into Docker, scans for vulnerabilities, and pushes to AWS ECR.
  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: target

      - name: Extract Maven Version
        id: project_version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Configure AWS credentials using OIDC (No Keys Needed)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::828562155228:role/github-actions-ecr-role
          aws-region: us-east-1

      # 2. Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. Build Docker image for AWS ECR
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # Makes the image available locally for the Trivy scanner
          tags: |
            828562155228.dkr.ecr.us-east-1.amazonaws.com/java-demo:${{ steps.project_version.outputs.VERSION }}
            828562155228.dkr.ecr.us-east-1.amazonaws.com/java-demo:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Run Trivy vulnerability scanner
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '828562155228.dkr.ecr.us-east-1.amazonaws.com/java-demo:${{ steps.project_version.outputs.VERSION }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 5. Upload Trivy scan results to GitHub Security tab
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # 6. Push Docker image to Amazon ECR (Only if scanner passes)
      - name: Push Docker image to Amazon ECR
        run: |
          docker push 828562155228.dkr.ecr.us-east-1.amazonaws.com/java-demo:${{ steps.project_version.outputs.VERSION }}
          docker push 828562155228.dkr.ecr.us-east-1.amazonaws.com/java-demo:latest
